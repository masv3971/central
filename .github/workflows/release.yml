name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/skills/**", "scripts/**"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        run: scripts/build-bundle.sh "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/')

      - name: Validate skills (PR)
        run: scripts/build-bundle.sh "pr-${{ github.run_number }}"
        if: github.event_name == 'pull_request'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
